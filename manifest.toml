schema-version = 1

[package]
title = "LogiXstream"
version = "0.1.0"
id = "com.anil.vegaott"
icon = "@image/vega.png"

[os.version]
target = "1.2"
min = "1.2"

[components]

[[components.interactive]]
id = "com.anil.vegaott.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
icon = "@image/vega.png"

[[message]]
uri = "logixstream://home"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://movies"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://live-tv"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://movie"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://play"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://settings"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://profile"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://edit-profile"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://search"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://movie/jawan"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[[message]]
uri = "logixstream://play/jawan"
sender-privileges = ["*"]
receiver-privileges = ["self"]

[wants]

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.drm.key"

[[wants.service]]
id = "com.amazon.drm.crypto"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

[[wants.service]]
id = "com.amazon.network.service"

# Required for the Vega OS on-screen keyboard used by TextInput controls.
[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.inputd.service"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[[wants.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.privilege]]
id = "com.amazon.privilege.security.file-sharing"

[[needs.privilege]]
id = "com.amazon.media.secureplayback"

[offers]

[[offers.module]]
id = "/com.anil.vegaott.deeplinks@IDeeplinks"
includes-messages = [
  "logixstream://home",
  "logixstream://movies",
  "logixstream://live-tv",
  "logixstream://movie",
  "logixstream://play",
  "logixstream://settings",
  "logixstream://profile",
  "logixstream://edit-profile",
  "logixstream://search",
  "logixstream://movie/jawan",
  "logixstream://play/jawan",
]

[[offers.interaction]]
id = "com.anil.vegaott.main"
launch-uris = [
  "logixstream://home",
  "logixstream://movies",
  "logixstream://live-tv",
  "logixstream://search",
  "logixstream://movie/jawan",
  "logixstream://play/jawan",
  "logixstream://settings",
  "logixstream://profile",
]

[[offers.message-target]]
uris = [
  "logixstream://home",
  "logixstream://movies",
  "logixstream://live-tv",
  "logixstream://movie",
  "logixstream://play",
  "logixstream://settings",
  "logixstream://profile",
  "logixstream://edit-profile",
  "logixstream://search",
  "logixstream://movie/jawan",
  "logixstream://play/jawan",
]
uses-component = "com.anil.vegaott.main"

[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_netmgr_lib_2@INetmgrTurbomodule_0"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.screens_3@IScreens_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"
